name: Deploy to Mac Mini

on:
  push:
    branches:
      - upgrade
  workflow_dispatch:

concurrency:
  group: deploy-mac-mini
  cancel-in-progress: false

env:
  APP_DIR: /Users/jason/DEV/momentum-etf

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Pull, build, and restart launchd services
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/Users/jason/DEV/momentum-etf/.venv/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin"
          cd "$APP_DIR"

          set -a
          source .env
          set +a

          .venv/bin/python infra/cron/deploy_flag_set.py || echo ">>> deploy 플래그 설정 실패 (계속 진행)"
          trap 'cd "$APP_DIR" && .venv/bin/python infra/cron/deploy_flag_clear.py || true' EXIT

          PREV_SHA="$(git rev-parse HEAD)"
          git fetch origin upgrade
          git reset --hard origin/upgrade
          NEW_SHA="$(git rev-parse HEAD)"

          if [ "$PREV_SHA" != "$NEW_SHA" ] && git diff --name-only "$PREV_SHA" "$NEW_SHA" | grep -q '^requirements\.txt$'; then
            echo ">>> requirements.txt 변경 감지 — pip install 실행"
            .venv/bin/pip install -q -r requirements.txt
          fi

          if [ "$PREV_SHA" != "$NEW_SHA" ] && git diff --name-only "$PREV_SHA" "$NEW_SHA" | grep -qE '^web/package(-lock)?\.json$'; then
            echo ">>> web/package*.json 변경 감지 — npm ci 실행"
            npm --prefix web ci
          fi

          npm --prefix web run build

          UID_NUM="$(id -u)"
          launchctl kickstart -k "gui/$UID_NUM/com.momentum-etf.fastapi"
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:8000/internal/health >/dev/null 2>&1; then
              echo ">>> fastapi health check passed"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "fastapi health check failed" >&2
              tail -n 60 logs/launchd-fastapi.err.log >&2 || true
              exit 1
            fi
            sleep 1
          done

          launchctl kickstart -k "gui/$UID_NUM/com.momentum-etf.web"
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:3000/api/live >/dev/null 2>&1; then
              echo ">>> web live check passed"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "web live check failed" >&2
              tail -n 60 logs/launchd-web.err.log >&2 || true
              exit 1
            fi
            sleep 1
          done

          launchctl kickstart -k "gui/$UID_NUM/com.momentum-etf.scheduler"
          echo ">>> Mac Mini deployment completed."

      - name: Collect Mac Mini metrics
        if: ${{ always() }}
        id: meta
        shell: bash
        run: |
          cd "$APP_DIR"
          VERSION=$(git log -1 --format="%cd-%h" --date=format:"%Y-%m-%d" 2>/dev/null || echo "unknown")
          COMMIT_MSG=$(git log -1 --pretty=%s 2>/dev/null || echo "")
          DISK_FREE=$(df -h /System/Volumes/Data | awk 'NR==2 {print $4}')
          DISK_USE=$(df -h /System/Volumes/Data | awk 'NR==2 {print $5}')
          APP_SIZE=$(du -sh "$APP_DIR" 2>/dev/null | awk '{print $1}')
          DB_SIZE=$(du -sh /opt/homebrew/var/mongodb 2>/dev/null | awk '{print $1}')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit_msg=${COMMIT_MSG}" >> "$GITHUB_OUTPUT"
          echo "disk_free=${DISK_FREE:-unknown}" >> "$GITHUB_OUTPUT"
          echo "disk_use=${DISK_USE:-unknown}" >> "$GITHUB_OUTPUT"
          echo "app_size=${APP_SIZE:-unknown}" >> "$GITHUB_OUTPUT"
          echo "db_size=${DB_SIZE:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Notify Slack (deploy succeeded)
        if: ${{ success() }}
        env:
          SLACK_WEBHOOK: ${{ secrets.LOGS_SLACK_WEBHOOK }}
          APP_VERSION: ${{ steps.meta.outputs.version }}
          COMMIT_MSG: ${{ steps.meta.outputs.commit_msg }}
          DISK_FREE: ${{ steps.meta.outputs.disk_free }}
          DISK_USE: ${{ steps.meta.outputs.disk_use }}
          APP_SIZE: ${{ steps.meta.outputs.app_size }}
          DB_SIZE: ${{ steps.meta.outputs.db_size }}
        shell: bash
        run: |
          cd "$APP_DIR"
          PAYLOAD=$(.venv/bin/python - << 'EOF'
          import json, os
          lines = [
              "✅ Mac Mini (momentum-etf) 배포 완료 (branch: upgrade)",
              f"APP_VERSION: {os.environ['APP_VERSION']}",
              f"COMMIT: {os.environ['COMMIT_MSG']}",
              f"DISK_FREE: {os.environ['DISK_FREE']}",
              f"DISK_USE: {os.environ['DISK_USE']}",
              f"APP_SIZE: {os.environ['APP_SIZE']} / DB_SIZE: {os.environ['DB_SIZE']}",
          ]
          print(json.dumps({"text": "\n".join(lines)}, ensure_ascii=False))
          EOF
          )
          curl -fsS -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK"

      - name: Notify Slack (deploy failed)
        if: ${{ failure() }}
        env:
          SLACK_WEBHOOK: ${{ secrets.LOGS_SLACK_WEBHOOK }}
          COMMIT_MSG: ${{ steps.meta.outputs.commit_msg }}
          DISK_FREE: ${{ steps.meta.outputs.disk_free }}
          DISK_USE: ${{ steps.meta.outputs.disk_use }}
          APP_SIZE: ${{ steps.meta.outputs.app_size }}
          DB_SIZE: ${{ steps.meta.outputs.db_size }}
        shell: bash
        run: |
          cd "$APP_DIR"
          PAYLOAD=$(.venv/bin/python - << 'EOF'
          import json, os
          lines = [
              "<!channel> ❌ Mac Mini (momentum-etf) 배포 실패 (branch: upgrade)",
              f"Repo: {os.environ['GITHUB_REPOSITORY']}",
              f"Commit: {os.environ['GITHUB_SHA']}",
              f"Message: {os.environ['COMMIT_MSG']}",
              f"DISK_FREE: {os.environ['DISK_FREE']}",
              f"DISK_USE: {os.environ['DISK_USE']}",
              f"APP_SIZE: {os.environ['APP_SIZE']} / DB_SIZE: {os.environ['DB_SIZE']}",
              f"Run: https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          ]
          print(json.dumps({"text": "\n".join(lines)}, ensure_ascii=False))
          EOF
          )
          curl -fsS -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK"
