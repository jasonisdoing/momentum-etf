name: Deploy to Mac Mini

on:
  push:
    branches:
      - upgrade
  workflow_dispatch:

concurrency:
  group: deploy-mac-mini
  cancel-in-progress: false

env:
  APP_DIR: /Users/jason/DEV/momentum-etf

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Pull, build, and restart launchd services
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/Users/jason/DEV/momentum-etf/.venv/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin"
          cd "$APP_DIR"

          set -a
          source .env
          set +a

          # 배포 잠금이 없으면 워커가 새 배치를 가져가 scheduler 재시작에 끊긴다 — 설정 실패면 배포를 멈춘다.
          .venv/bin/python infra/cron/deploy_flag_set.py

          PREV_SHA="$(git rev-parse HEAD)"
          NEW_SHA="$PREV_SHA"
          ROLLBACK_READY=0
          UID_NUM="$(id -u)"

          rollback_on_error() {
            echo ">>> 배포 실패 감지 — 직전 커밋(${PREV_SHA})으로 자동 롤백 시작" >&2
            cd "$APP_DIR"
            git reset --hard "$PREV_SHA"
            if git diff --name-only "$PREV_SHA" "$NEW_SHA" | grep -q '^requirements\.txt$'; then
              .venv/bin/pip install -q -r requirements.txt || true
            fi
            if git diff --name-only "$PREV_SHA" "$NEW_SHA" | grep -qE '^web/package(-lock)?\.json$'; then
              npm --prefix web ci || true
            fi
            npm --prefix web run build || true
            launchctl kickstart -k "gui/$UID_NUM/com.momentum-etf.fastapi" || true
            launchctl kickstart -k "gui/$UID_NUM/com.momentum-etf.web" || true
            launchctl kickstart -k "gui/$UID_NUM/com.momentum-etf.scheduler" || true

            local rb_status="failed"
            for i in $(seq 1 20); do
              if curl -fsS --max-time 2 http://127.0.0.1:8000/internal/health >/dev/null 2>&1; then
                rb_status="succeeded"
                break
              fi
              sleep 1
            done
            {
              echo "rollback_status=${rb_status}"
              echo "rollback_sha=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
              echo "rollback_version=$(.venv/bin/python -c "from pathlib import Path; import re; m = re.search(r'APP_VERSION\s*=\s*[\'\"]([^\'\"]+)[\'\"]', Path('utils/logger.py').read_text(encoding='utf-8')); print(m.group(1) if m else 'unknown')")"
              echo "rollback_msg=$(git log -1 --pretty=%s 2>/dev/null || echo "")"
            } >> "$GITHUB_OUTPUT"
            echo ">>> 직전 커밋(${PREV_SHA})으로 롤백 완료 (status=${rb_status})" >&2
          }

          on_exit() {
            local status=$?
            if [ "$status" -ne 0 ] && [ "$ROLLBACK_READY" -eq 1 ] && [ "$PREV_SHA" != "$NEW_SHA" ]; then
              rollback_on_error || true
            fi
            cd "$APP_DIR" && .venv/bin/python infra/cron/deploy_flag_clear.py || true
            return "$status"
          }
          trap on_exit EXIT

          git fetch origin upgrade
          git reset --hard origin/upgrade
          NEW_SHA="$(git rev-parse HEAD)"
          ROLLBACK_READY=1

          if [ "$PREV_SHA" != "$NEW_SHA" ] && git diff --name-only "$PREV_SHA" "$NEW_SHA" | grep -q '^requirements\.txt$'; then
            echo ">>> requirements.txt 변경 감지 — pip install 실행"
            .venv/bin/pip install -q -r requirements.txt
          fi

          if [ "$PREV_SHA" != "$NEW_SHA" ] && git diff --name-only "$PREV_SHA" "$NEW_SHA" | grep -qE '^web/package(-lock)?\.json$'; then
            echo ">>> web/package*.json 변경 감지 — npm ci 실행"
            npm --prefix web ci
          fi

          npm --prefix web run build

          launchctl kickstart -k "gui/$UID_NUM/com.momentum-etf.fastapi"
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:8000/internal/health >/dev/null 2>&1; then
              echo ">>> fastapi health check passed"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "fastapi health check failed" >&2
              tail -n 60 logs/launchd-fastapi.err.log >&2 || true
              exit 1
            fi
            sleep 1
          done

          launchctl kickstart -k "gui/$UID_NUM/com.momentum-etf.web"
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:3000/api/live >/dev/null 2>&1; then
              echo ">>> web live check passed"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "web live check failed" >&2
              tail -n 60 logs/launchd-web.err.log >&2 || true
              exit 1
            fi
            sleep 1
          done

          # 프론트(web/)·문서·워크플로우·APP_VERSION 만 바뀐 배포에서는 scheduler 재시작을 건너뛴다.
          if [ "$PREV_SHA" = "$NEW_SHA" ] || git diff --name-only "$PREV_SHA" "$NEW_SHA" | grep -qvE '^(web/|docs/|\.github/|README\.md$|utils/logger\.py$)'; then
            # 재시작 직전 배포 잠금을 다시 건 뒤 실행 중 배치를 센다 — 잠금 뒤의 claim 은 워커가 되돌린다
            # (`batch_queue.claim_next_pending`), 그 전 claim 은 running 으로 세어진다.
            .venv/bin/python infra/cron/deploy_flag_set.py
            # 실행 중인 서버 배치가 있으면 최대 600초(10분)까지 자연 종료를 기다린다. 건수를 못 세면 배포를 멈춘다.
            RUNNING_CNT=""
            for i in $(seq 1 120); do
              RUNNING_CNT=$(.venv/bin/python -c "from utils.db_manager import get_db_connection; db=get_db_connection(); assert db is not None, 'DB 연결 실패'; print(db.batch_queue.count_documents({'status':'running','app_type':'Server'}))" 2>/dev/null | tail -n 1 || true)
              if [ "${RUNNING_CNT}" = "0" ]; then
                break
              fi
              echo ">>> 실행 중인 서버 배치 ${RUNNING_CNT:-?}건 종료 대기 (${i}/120)..."
              sleep 5
            done
            if [ "${RUNNING_CNT}" != "0" ]; then
              # 실행 중인 배치를 끊지 않는다 — scheduler 재시작을 보류하고 실패로 알린다(롤백하지 않는다:
              # fastapi·web 은 이미 새 버전이고, 배치는 새 코드로 뜬다). 재시작은 배치가 끝난 뒤 직접 한다.
              ROLLBACK_READY=0
              echo "fail_reason=실행 중인 서버 배치 ${RUNNING_CNT:-?}건이 10분 안에 끝나지 않아 scheduler 재시작을 보류했습니다 — 배치 종료 후 수동 재시작 필요" >> "$GITHUB_OUTPUT"
              echo ">>> 실행 중인 배치가 남아 scheduler 재시작 보류" >&2
              exit 1
            fi
            launchctl kickstart -k "gui/$UID_NUM/com.momentum-etf.scheduler"
          else
            echo ">>> Python/배치 변경 없음 — scheduler 재시작 생략"
          fi
          echo ">>> Mac Mini deployment completed."

      - name: Collect Mac Mini metrics
        if: ${{ always() }}
        id: meta
        shell: bash
        run: |
          cd "$APP_DIR"
          VERSION=$(.venv/bin/python -c "from pathlib import Path; import re; m = re.search(r'APP_VERSION\s*=\s*[\'\"]([^\'\"]+)[\'\"]', Path('utils/logger.py').read_text(encoding='utf-8')); print(m.group(1) if m else 'unknown')")
          COMMIT_MSG=$(git log -1 --pretty=%s "${{ github.sha }}" 2>/dev/null || echo "")
          DISK_FREE=$(df -h /System/Volumes/Data | awk 'NR==2 {print $4}')
          DISK_USE=$(df -h /System/Volumes/Data | awk 'NR==2 {print $5}')
          APP_SIZE=$(du -sh "$APP_DIR" 2>/dev/null | awk '{print $1}')
          DB_SIZE=$(du -sh /opt/homebrew/var/mongodb 2>/dev/null | awk '{print $1}')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit_msg=${COMMIT_MSG}" >> "$GITHUB_OUTPUT"
          echo "disk_free=${DISK_FREE:-unknown}" >> "$GITHUB_OUTPUT"
          echo "disk_use=${DISK_USE:-unknown}" >> "$GITHUB_OUTPUT"
          echo "app_size=${APP_SIZE:-unknown}" >> "$GITHUB_OUTPUT"
          echo "db_size=${DB_SIZE:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Notify Slack (deploy succeeded)
        if: ${{ success() }}
        env:
          SLACK_WEBHOOK: ${{ secrets.LOGS_SLACK_WEBHOOK }}
          APP_VERSION: ${{ steps.meta.outputs.version }}
          COMMIT_MSG: ${{ steps.meta.outputs.commit_msg }}
          DISK_FREE: ${{ steps.meta.outputs.disk_free }}
          DISK_USE: ${{ steps.meta.outputs.disk_use }}
          APP_SIZE: ${{ steps.meta.outputs.app_size }}
          DB_SIZE: ${{ steps.meta.outputs.db_size }}
        shell: bash
        run: |
          cd "$APP_DIR"
          PAYLOAD=$(.venv/bin/python - << 'EOF'
          import json, os
          lines = [
              "✅ Mac Mini (momentum-etf) 배포 완료 (branch: upgrade)",
              f"APP_VERSION: {os.environ['APP_VERSION']}",
              f"COMMIT: {os.environ['COMMIT_MSG']}",
              f"DISK_FREE: {os.environ['DISK_FREE']}",
              f"DISK_USE: {os.environ['DISK_USE']}",
              f"APP_SIZE: {os.environ['APP_SIZE']} / DB_SIZE: {os.environ['DB_SIZE']}",
          ]
          print(json.dumps({"text": "\n".join(lines)}, ensure_ascii=False))
          EOF
          )
          curl -fsS -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK"

      - name: Notify Slack (deploy failed)
        if: ${{ failure() }}
        env:
          SLACK_WEBHOOK: ${{ secrets.LOGS_SLACK_WEBHOOK }}
          COMMIT_MSG: ${{ steps.meta.outputs.commit_msg }}
          DISK_FREE: ${{ steps.meta.outputs.disk_free }}
          DISK_USE: ${{ steps.meta.outputs.disk_use }}
          APP_SIZE: ${{ steps.meta.outputs.app_size }}
          DB_SIZE: ${{ steps.meta.outputs.db_size }}
          ROLLBACK_STATUS: ${{ steps.deploy.outputs.rollback_status }}
          ROLLBACK_SHA: ${{ steps.deploy.outputs.rollback_sha }}
          ROLLBACK_VERSION: ${{ steps.deploy.outputs.rollback_version }}
          ROLLBACK_MSG: ${{ steps.deploy.outputs.rollback_msg }}
          FAIL_REASON: ${{ steps.deploy.outputs.fail_reason }}
        shell: bash
        run: |
          cd "$APP_DIR"
          PAYLOAD=$(.venv/bin/python - << 'EOF'
          import json, os
          lines = [
              "<!channel> ❌ Mac Mini (momentum-etf) 배포 실패 (branch: upgrade)",
              f"Repo: {os.environ['GITHUB_REPOSITORY']}",
              f"Commit: {os.environ['GITHUB_SHA']}",
              f"Message: {os.environ['COMMIT_MSG']}",
              *([f"사유: {os.environ['FAIL_REASON']}"] if os.environ.get("FAIL_REASON") else []),
              f"DISK_FREE: {os.environ['DISK_FREE']}",
              f"DISK_USE: {os.environ['DISK_USE']}",
              f"APP_SIZE: {os.environ['APP_SIZE']} / DB_SIZE: {os.environ['DB_SIZE']}",
              f"Run: https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          ]
          print(json.dumps({"text": "\n".join(lines)}, ensure_ascii=False))
          EOF
          )
          curl -fsS -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK"

          if [ -n "${ROLLBACK_STATUS:-}" ]; then
            ROLLBACK_PAYLOAD=$(.venv/bin/python - << 'EOF'
          import json, os
          status = os.environ["ROLLBACK_STATUS"]
          header = (
              "↩️ Mac Mini (momentum-etf) 직전 커밋으로 자동 복원 완료"
              if status == "succeeded"
              else "<!channel> ⚠️ Mac Mini (momentum-etf) 자동 복원 실패 (수동 확인 필요)"
          )
          lines = [
              header,
              f"APP_VERSION: {os.environ.get('ROLLBACK_VERSION', 'unknown')}",
              f"Commit: {os.environ.get('ROLLBACK_SHA', 'unknown')}",
              f"Message: {os.environ.get('ROLLBACK_MSG', '')}",
          ]
          print(json.dumps({"text": "\n".join(lines)}, ensure_ascii=False))
          EOF
          )
            curl -fsS -X POST -H 'Content-type: application/json' --data "$ROLLBACK_PAYLOAD" "$SLACK_WEBHOOK"
          fi
